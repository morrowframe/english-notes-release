name: Publish Full Web record suggestions once
on:
  push:
    branches:
      - publish/full-web-record-suggestions-20261007

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ARTIFACT_URL: 'https://sdmntprwestus.oaiusercontent.com/files/00000000-4980-8230-85d8-0aeecd1989f1/raw?se=2026-10-07T16%3A13%3A37Z&sp=r&sv=2026-02-06&sr=b&scid=5a1a2a3a-9473-5a2b-bd80-784599866b9f&skoid=c69179d1-5b5d-430f-afa3-b9bdcf9d6497&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-07T14%3A44%3A55Z&ske=2026-10-08T14%3A44%3A55Z&sks=b&skv=2026-02-06&sig=peJfB/1mmQqCsdYfEeTfKWDbp7UEKr/1GOvQil7%2BM%2BQ%3D'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
      - name: Download verified Full Web
        run: |
          curl --fail --location --retry 2 "$ARTIFACT_URL" --output /tmp/full-web.zip
          test -s /tmp/full-web.zip
      - name: Replace Full Web app only
        run: |
          sha256sum release-manifest.json > /tmp/release-manifest.sha256
          rm -rf assets codec icons index.html manifest.webmanifest shell-assets.json sw.js codec-worker.js relay-test.html
          unzip -q /tmp/full-web.zip -d .
          test -f index.html
          test -f sw.js
          test -f codec/excel-v8.wasm
          test -n "$(find assets -maxdepth 1 -name 'sqlite3-*.wasm' -print -quit)"
          grep -R --fixed-strings 'english-notes-release.yzzcgzx.workers.dev' assets >/dev/null
          grep -R --fixed-strings 'webdav-relay-production.up.railway.app' assets >/dev/null
          grep -R --fixed-strings '最近标签' assets >/dev/null
          grep -R --fixed-strings '最近话题' assets >/dev/null
          grep -R --fixed-strings '最近来源' assets >/dev/null
          sha256sum -c /tmp/release-manifest.sha256
          test -f web/index.html
      - name: Publish Full Web
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "web: publish record suggestions"
          git push origin HEAD:gh-pages
