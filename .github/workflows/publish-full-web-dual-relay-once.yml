name: Publish Full Web dual relay once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-full-web-dual-relay-once.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ARTIFACT_URL: 'https://sdmntprwestus2.oaiusercontent.com/files/00000000-0bfc-81f8-9347-a714d84abc09/raw?se=2026-10-07T14%3A46%3A40Z&sp=r&sv=2026-02-06&sr=b&scid=095e6a4d-e94d-5ea3-a1fa-c135f023d0ac&skoid=c69179d1-5b5d-430f-afa3-b9bdcf9d6497&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-07T12%3A09%3A55Z&ske=2026-10-08T12%3A09%3A55Z&sks=b&skv=2026-02-06&sig=NV5PCjPPI0aLr9CCKAmgMQH4DaPMXQPe2Dsm/jeMqaY%3D'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
      - name: Download verified Full Web artifact
        run: |
          curl --fail --location --retry 3 "$ARTIFACT_URL" --output /tmp/full-web-release.zip
          test -s /tmp/full-web-release.zip
      - name: Replace Full Web app only
        run: |
          sha256sum release-manifest.json > /tmp/release-manifest.sha256
          rm -rf assets codec icons index.html manifest.webmanifest shell-assets.json sw.js codec-worker.js relay-test.html
          unzip -q /tmp/full-web-release.zip -d .
          test -f index.html
          test -f sw.js
          test -f codec/excel-v8.wasm
          test -f assets/sqlite3-Con_VOcu.wasm
          grep -R --fixed-strings 'english-notes-release.yzzcgzx.workers.dev' assets >/dev/null
          grep -R --fixed-strings 'webdav-relay-production.up.railway.app' assets >/dev/null
          sha256sum -c /tmp/release-manifest.sha256
          test -f web/index.html
      - name: Commit Full Web dual relay release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "web: publish dual-relay Full Web release"
          git push origin HEAD:gh-pages
