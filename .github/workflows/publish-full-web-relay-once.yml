name: Publish Full Web relay candidate once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-full-web-relay-once.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ARTIFACT_URL: 'https://sdmntprsouthcentralus.oaiusercontent.com/files/00000000-b050-81f7-822a-2633db985039/raw?se=2026-10-07T11%3A47%3A41Z&sp=r&sv=2026-02-06&sr=b&scid=e4ae12bf-841f-519a-8044-f77e06f92d5a&skoid=c69179d1-5b5d-430f-afa3-b9bdcf9d6497&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-07T00%3A56%3A47Z&ske=2026-10-08T00%3A56%3A47Z&sks=b&skv=2026-02-06&sig=hdasDt1xRli7bYvCOSKgym66kKiDEh4f1OzxvJLfnWc%3D'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
      - name: Download verified Full Web artifact
        run: |
          curl --fail --location --retry 3 "$ARTIFACT_URL" --output /tmp/full-web-pages.zip
          test -s /tmp/full-web-pages.zip
      - name: Replace Pages app while preserving publication metadata
        run: |
          sha256sum release-manifest.json > /tmp/release-manifest.sha256
          rm -rf assets codec icons index.html manifest.webmanifest shell-assets.json sw.js codec-worker.js
          unzip -q /tmp/full-web-pages.zip -d .
          test -f index.html
          test -f sw.js
          test -f codec/excel-v8.wasm
          test -f assets/sqlite3-Con_VOcu.wasm
          grep -R --fixed-strings 'english-notes-release.yzzcgzx.workers.dev' assets >/dev/null
          sha256sum -c /tmp/release-manifest.sha256
          test -f web/index.html
      - name: Commit Pages candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "web: publish Full Web with production WebDAV relay"
          git push origin HEAD:gh-pages
