name: Publish Full Web iOS candidate once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-full-web-once.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ARTIFACT_URL: 'https://sdmntprsouthcentralus.oaiusercontent.com/files/00000000-fa28-81f7-8bd5-474a176a34b8/raw?se=2026-10-07T11%3A04%3A37Z&sp=r&sv=2026-02-06&sr=b&scid=1e147e9d-5604-50d6-ae77-bbac82232f9d&skoid=c69179d1-5b5d-430f-afa3-b9bdcf9d6497&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-07T00%3A57%3A00Z&ske=2026-10-08T00%3A57%3A00Z&sks=b&skv=2026-02-06&sig=At90F2%2B0nM5kwZCDQwOCkGA6FztFhijVK%2BzW5XAml/4%3D'
    steps:
      - uses: actions/checkout@v4
      - name: Preserve disabled release manifest proof
        run: |
          sha256sum release-manifest.json > /tmp/manifest.before
          grep -q '"disabled": true' release-manifest.json
      - name: Download verified Full Web artifact
        run: |
          curl --fail --location --retry 3 "$ARTIFACT_URL" --output /tmp/full-web-pages.zip
          test -s /tmp/full-web-pages.zip
      - name: Publish static site under web
        run: |
          rm -rf web
          mkdir web
          unzip -q /tmp/full-web-pages.zip -d web
          test -f web/index.html
          test -f web/sw.js
          test -f web/codec/excel-v8.wasm
          test -f web/assets/sqlite3-Con_VOcu.wasm
          sha256sum -c /tmp/manifest.before
      - name: Commit verified static site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web
          git diff --cached --quiet && exit 0
          git commit -m "web: publish iOS Safari acceptance candidate"
          git push
