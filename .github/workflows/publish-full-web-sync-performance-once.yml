name: Publish Full Web sync performance once
on:
  push:
    branches:
      - publish/full-web-sync-performance-20261007

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ARTIFACT_URL: 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-3c6c-81f5-8be6-acd2f8662b27/raw?se=2026-10-07T15%3A56%3A30Z&sp=r&sv=2026-02-06&sr=b&scid=8a079e03-a2e7-57c6-a471-61d08b2f14b1&skoid=c69179d1-5b5d-430f-afa3-b9bdcf9d6497&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-07T14%3A44%3A56Z&ske=2026-10-08T14%3A44%3A56Z&sks=b&skv=2026-02-06&sig=eoM4XhwFAOQGDLBMLNzhNLXSz8d9K4tkTo85X24Enq8%3D'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
      - name: Download verified optimized Full Web
        run: |
          curl --fail --location --retry 2 "$ARTIFACT_URL" --output /tmp/full-web.zip
          test -s /tmp/full-web.zip
      - name: Replace Full Web app only
        run: |
          sha256sum release-manifest.json > /tmp/release-manifest.sha256
          rm -rf assets codec icons index.html manifest.webmanifest shell-assets.json sw.js codec-worker.js relay-test.html
          unzip -q /tmp/full-web.zip -d .
          test -f index.html
          test -f sw.js
          test -f codec/excel-v8.wasm
          test -n "$(find assets -maxdepth 1 -name 'sqlite3-*.wasm' -print -quit)"
          grep -R --fixed-strings 'english-notes-release.yzzcgzx.workers.dev' assets >/dev/null
          grep -R --fixed-strings 'webdav-relay-production.up.railway.app' assets >/dev/null
          sha256sum -c /tmp/release-manifest.sha256
          test -f web/index.html
      - name: Publish optimized Full Web
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "web: publish sync performance fix"
          git push origin HEAD:gh-pages
